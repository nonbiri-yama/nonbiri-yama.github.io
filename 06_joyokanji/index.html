<!DOCTYPE html>
<html lang="ja">

<!-- headタグ、ブラウザのタブに表示される文字 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="小学1年生〜中学生の常用漢字を、音訓読みの例文から選んで、ランナーをゴールさせる漢字学習ゲーム。">
    <title>かんじえらびレース - のんびりやまのゲーム</title>
    <link rel="stylesheet" href="style_layout.css">
</head>

<!-- ##################################################### -->
<!-- bodyタグ、headを除く末尾まですべて -->
<body>

    <!-- ##################################################### -->
    <!-- div(ad-container)、広告バナー、または、フォールバックバナー -->
    <div id="ad-container">
        <a href="https://nonbiri-yama.github.io/" class="fallback-banner">

            <!-- div(banner-info)、バナー内の左側文字 -->
            <div class="banner-info">
                <span class="banner-site-name">のんびりやま のゲーム</span>
                <span class="banner-url">https://nonbiri-yama.github.io/</span>
            </div>

            <!-- div(banner-visual)、バナー内の右側イラスト -->
            <img class="banner-visual" id="banner-visual-img" src="assets/adbanner_960px100px_72dpi.png" alt="">
        </a>
    </div>

    <script>
        // バナー画像の読み込みに失敗したとき、少し待って自動で再試行する
        // （GitHub Pages経由だと、まれに一時的な通信の瞬断で読み込みに失敗することがあるため）
        (function () {
            var img = document.getElementById("banner-visual-img");
            if (!img) return;
            var retries = 0;
            var MAX_RETRIES = 4;
            img.addEventListener("error", function retry() {
                if (retries >= MAX_RETRIES) return;
                retries += 1;
                window.setTimeout(function () {
                    img.src = "assets/adbanner_960px100px_72dpi.png?retry=" + retries;
                }, 400 * retries);
            });
        })();
    </script>

    <!-- ##################################################### -->
    <!-- div(game-wrapper)、ゲーム画面本体 -->
    <div id="game-wrapper">
        <div id="stage-container">
            <canvas id="game-canvas" width="480" height="768"></canvas>
        </div>
    </div>

    <!-- ##################################################### -->
    <!-- div(status-display)、ステータス表示 -->
    <div id="status-display">
        <span id="progress-count">タイム: 00:00.0</span>
        <span id="mistake-count">まちがい: 0</span>
        <span id="current-char-label"></span>
    </div>

    <!-- ##################################################### -->
    <!-- div(sub-area)、ゲーム説明 -->
    <div id="sub-area">

        <!-- div(description-area)、ゲーム説明 -->
        <div id="description-area">
            <p>正しい漢字を選んで、ランナーをゴールさせよう。</p>
        </div>

        <!-- div(records-area)、きろく一覧 -->
        <div id="records-area">
            <div id="records-header">
                <p class="records-title">きろく（はやい じゅん）</p>
                <button id="records-reset-btn" type="button">リセット</button>
            </div>
            <ul id="records-list"></ul>
        </div>

        <!-- a、トップページへのリンク -->
        <a href="../index.html" id="top-link">トップへもどる</a>

    </div>

    <!-- ##################################################### -->
    <!-- footer(page-footer)、コピーライトのフッター -->
    <footer id="page-footer">
        <p>&copy; 2026 nonbiri-yama. All rights reserved.</p>
    </footer>

    <script type="module" src="src/main.js"></script>

</body>
</html>
